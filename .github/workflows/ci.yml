name: Build and Release Extensions

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and release
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip version]') }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bump extension version
        id: version
        run: |
          version="$(bun scripts/bump-extension-version.mjs)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to v$version [skip version]"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Chrome
        env:
          VITE_IMPORT_MEDIA_UPLOAD_TOKEN: ${{ secrets.VITE_IMPORT_MEDIA_UPLOAD_TOKEN }}
        run: bun run build:chrome

      - name: Zip Chrome extension
        run: |
          cd dist_chrome
          zip -r ../vibesearch-chrome-v${{ steps.version.outputs.version }}.zip .

      - name: Build Firefox
        env:
          VITE_IMPORT_MEDIA_UPLOAD_TOKEN: ${{ secrets.VITE_IMPORT_MEDIA_UPLOAD_TOKEN }}
        run: bun run build:firefox

      - name: Zip Firefox extension
        run: |
          cd dist_firefox
          zip -r ../vibesearch-firefox-v${{ steps.version.outputs.version }}.zip .

      - name: Upload Chrome extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibesearch-chrome
          path: vibesearch-chrome-v${{ steps.version.outputs.version }}.zip

      - name: Upload Firefox extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibesearch-firefox
          path: vibesearch-firefox-v${{ steps.version.outputs.version }}.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chrome_zip="vibesearch-chrome-v${VERSION}.zip"
          firefox_zip="vibesearch-firefox-v${VERSION}.zip"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$chrome_zip" "$firefox_zip" --clobber
          else
            gh release create "$RELEASE_TAG" "$chrome_zip" "$firefox_zip" \
              --target "$RELEASE_SHA" \
              --title "VibeSearch v${VERSION}" \
              --notes "Automated Chrome and Firefox extension bundles for v${VERSION}."
          fi
