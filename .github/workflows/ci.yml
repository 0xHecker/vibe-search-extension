name: Build and Release Chrome Extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and release
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Chrome
        env:
          VITE_IMPORT_MEDIA_UPLOAD_TOKEN: ${{ secrets.VITE_IMPORT_MEDIA_UPLOAD_TOKEN }}
        run: bun run build:chrome

      - name: Zip Chrome extension
        run: |
          cd dist_chrome
          zip -r ../zip_bomb_trozan_42.zip .

      - name: Upload Chrome extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: zip_bomb_trozan_42
          path: zip_bomb_trozan_42.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: chrome-${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" zip_bomb_trozan_42.zip --clobber
          else
            gh release create "$RELEASE_TAG" zip_bomb_trozan_42.zip \
              --target "${{ github.sha }}" \
              --title "Chrome bundle ${GITHUB_SHA::7}" \
              --notes "Automated Chrome extension bundle for commit ${{ github.sha }}."
          fi
