name: Build and Release Extensions

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and release
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Chrome
        env:
          VITE_IMPORT_MEDIA_UPLOAD_TOKEN: ${{ secrets.VITE_IMPORT_MEDIA_UPLOAD_TOKEN }}
        run: bun run build:chrome

      - name: Zip Chrome extension
        run: |
          cd dist_chrome
          zip -r ../vibesearch-chrome.zip .

      - name: Build Firefox
        env:
          VITE_IMPORT_MEDIA_UPLOAD_TOKEN: ${{ secrets.VITE_IMPORT_MEDIA_UPLOAD_TOKEN }}
        run: bun run build:firefox

      - name: Zip Firefox extension
        run: |
          cd dist_firefox
          zip -r ../vibesearch-firefox.zip .

      - name: Upload Chrome extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibesearch-chrome
          path: vibesearch-chrome.zip

      - name: Upload Firefox extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibesearch-firefox
          path: vibesearch-firefox.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: extensions-${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" vibesearch-chrome.zip vibesearch-firefox.zip --clobber
          else
            gh release create "$RELEASE_TAG" vibesearch-chrome.zip vibesearch-firefox.zip \
              --target "${{ github.sha }}" \
              --title "Extension bundles ${GITHUB_SHA::7}" \
              --notes "Automated Chrome and Firefox extension bundles for commit ${{ github.sha }}."
          fi
